server.port=8071
spring.application.name=configserver

#In a Spring Cloud Config Server application, activating the native profile tells the server to read configuration files from your local classpath or filesystem instead of a remote Git repository.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config

